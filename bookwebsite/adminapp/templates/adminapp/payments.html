<!-- payments.html -->

{% extends "adminapp/base.html" %}
{% block admin %}

<div class="container-fluid">

    <div class="card shadow border-0 rounded-4">

        <div class="card-body">

            <h2 class="fw-bold mb-4">
                Payment Details
            </h2>

            <div class="table-responsive">

                <table class="table table-bordered">

                    <thead class="table-dark">

                        <tr>
                            <th>Payment ID</th>
                            <th>User</th>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr>
                            <td>#PAY101</td>
                            <td>Vijay</td>
                            <td>₹500</td>
                            <td>UPI</td>

                            <td>
                                <span class="badge bg-success">
                                    Success
                                </span>
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

{% endblock %}
