   <!-- settings.html -->

{% extends "adminapp/base.html" %}
{% block admin %}

<div class="container-fluid">

    <div class="card shadow border-0 rounded-4">

        <div class="card-body">

            <h2 class="fw-bold mb-4">
                Settings
            </h2>

            <form>

                <div class="mb-3">

                    <label>Website Name</label>

                    <input type="text"
                        class="form-control"
                        value="Online Book Store">

                </div>

                <div class="mb-3">

                    <label>Email</label>

                    <input type="email"
                        class="form-control"
                        value="admin@gmail.com">

                </div>

                <div class="mb-3">

                    <label>Contact</label>

                    <input type="text"
                        class="form-control"
                        value="+91 9876543210">

                </div>

                <button class="btn btn-primary">
                    Save Changes
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
