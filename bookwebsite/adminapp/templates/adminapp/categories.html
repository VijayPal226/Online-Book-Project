<!-- categories.html -->

{% extends "adminapp/base.html" %}
{% block admin %}

<div class="container-fluid">

    <div class="card shadow border-0 rounded-4">

        <div class="card-body">

            <h2 class="fw-bold mb-4">
                Categories
            </h2>

            <form class="mb-4">

                <div class="row">

                    <div class="col-md-10">
                        <input type="text"
                            class="form-control"
                            placeholder="Enter category">
                    </div>

                    <div class="col-md-2">
                        <button class="btn btn-primary w-100">
                            Add
                        </button>
                    </div>

                </div>

            </form>

            <table class="table table-hover">

                <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>Category Name</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>1</td>
                        <td>Programming</td>

                        <td>
                            <button class="btn btn-danger btn-sm">
                                Delete
                            </button>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
