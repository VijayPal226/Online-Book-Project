{% extends "base.html" %}
{% load static %}

{% block main %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0 rounded-3">

                <div class="card-body p-4 text-center">

                    <!-- Title -->
                    <h3 class="mb-2">OTP Verification</h3>

                    <p class="text-muted mb-4">
                        Enter the 6-digit OTP sent to your email or mobile
                    </p>

                    <!-- Messages -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-info py-2">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <!-- OTP Form -->
                    <form method="POST">
                        {% csrf_token %}

                        <!-- OTP Input -->
                        <div class="mb-3">
                            <input type="text" name="otp" maxlength="6"
                                   class="form-control text-center fs-4 letter-spacing"
                                   placeholder="Enter OTP" required>
                        </div>

                        <!-- Verify Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Verify OTP
                            </button>
                        </div>

                    </form>

                    <!-- Resend OTP -->
                    <div class="mt-3">
                        <p class="text-muted small mb-1">Didn't receive OTP?</p>
                        <a href="{% url 'resend_otp' %}" class="text-decoration-none">
                            Resend OTP
                        </a>
                    </div>

                </div>

            </div>

        </div>
    </div>

</div>

<!-- Small style tweak -->
<style>
    .letter-spacing {
        letter-spacing: 8px;
    }
</style>

{% endblock %}
