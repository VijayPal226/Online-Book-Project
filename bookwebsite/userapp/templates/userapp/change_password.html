{% extends "base.html" %}
{% load static %}

{% block main %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4">Change Password</h3>

                    <form method="POST" novalidate>
                        {% csrf_token %}

                        <!-- Old Password -->
                        <div class="mb-3">
                            <label for="id_old_password" class="form-label">Old Password</label>
                            <input type="password" name="old_password" class="form-control"
                                   id="id_old_password" placeholder="Enter current password" required>
                        </div>

                        <!-- New Password -->
                        <div class="mb-3">
                            <label for="id_new_password1" class="form-label">New Password</label>
                            <input type="password" name="new_password1" class="form-control"
                                   id="id_new_password1" placeholder="Enter new password" required>
                        </div>

                        <!-- Confirm New Password -->
                        <div class="mb-3">
                            <label for="id_new_password2" class="form-label">Confirm New Password</label>
                            <input type="password" name="new_password2" class="form-control"
                                   id="id_new_password2" placeholder="Confirm new password" required>
                        </div>

                        <!-- Django Messages -->
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-info py-2">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}

                        <!-- Submit Button -->
                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-primary">
                                Update Password
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
